<pattern id="lines" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#99f6e4" stroke-opacity=".035"/></pattern>
</defs>
<rect width="1280" height="450" rx="26" fill="url(#bg)"/>
