<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-labelledby="title desc">
<title id="title">LoomRead — Turn reading into a conversation.</title>
<desc id="desc">A dark emerald banner with an illustrated PDF document and a question card. Upload a PDF, ask a question, and explore the answers.</desc>
